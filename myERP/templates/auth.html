{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College ERP - Sign In / Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
    body { background-color:#1E1E1E; color:white; font-family:'Segoe UI',sans-serif; }
    .auth-container { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background-color:#2A2A2A; border:none; border-radius:12px; color:white; box-shadow:0 4px 12px rgba(0,0,0,.3); padding:2rem; width:400px; transition:all .3s ease-in-out; }
    .form-control { background-color:#121212; border:1px solid #444; color:white; }
    .form-control:focus { border-color:#FFD700; background-color:#1C1C1C; color:white; box-shadow:none; }
    .btn-gold { background-color:#FFD700; color:black; font-weight:bold; transition:.3s; }
    .btn-gold:hover { background-color:#E6C200; color:black; }
    .toggle-link { color:#FFD700; cursor:pointer; }
    .toggle-link:hover { text-decoration:underline; }
    .form-box { display:none; }
    .form-box.active { display:block; animation:fadeIn .4s ease-in-out; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div class="auth-container">
  <div class="card" data-aos="zoom-in">

    <!-- Messages -->
    {% if messages %}
      <div class="mb-3">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} py-2 mb-2">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Sign In -->
    <div class="form-box {% if show == 'signin' %}active{% endif %}" id="signInForm">
      <h3 class="text-center mb-3">🔑 Sign In</h3>
      <form action="{% url 'accounts:signin' %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email ID</label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-gold w-100 mb-3">Sign In</button>
      </form>
      <p class="text-center">Don't have an account?
        <span class="toggle-link" onclick="showForm('signUpForm')">Sign Up</span>
      </p>
    </div>

    <!-- Sign Up -->
    <div class="form-box {% if show == 'signup' %}active{% endif %}" id="signUpForm">
      <h3 class="text-center mb-3">📝 Sign Up</h3>
      <form action="{% url 'accounts:signup' %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Enter your full name" name="fname" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email ID</label>
          <input type="email" class="form-control" placeholder="Enter your email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Roll Number</label>
          <input type="text" class="form-control" placeholder="Enter your roll number" name="rollNo" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Enter password" name="pas" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" placeholder="Re-enter password" name="cfmPas" required>
        </div>
        <button type="submit" class="btn btn-gold w-100 mb-3">Sign Up</button>
      </form>
      <p class="text-center">Already have an account?
        <span class="toggle-link" onclick="showForm('signInForm')">Sign In</span>
      </p>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({ duration: 800, once: true });

  function showForm(formId) {
    document.querySelectorAll('.form-box').forEach(f => f.classList.remove('active'));
    document.getElementById(formId).classList.add('active');
  }

  // Respect server-side default tab from context
  (function(){
    const show = "{{ show|default:'signin' }}";
    showForm(show === 'signup' ? 'signUpForm' : 'signInForm');
  })();
</script>
</body>
</html>
