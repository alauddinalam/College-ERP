<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/index.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 sidebar">
            <h4 class="text-center text-light">📚 College ERP</h4>
            <a href="{% url 'myERP:dashboard' %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{% url 'myERP:attendance' %}"><i class="bi bi-calendar-check"></i> Attendance</a>
            <a href="{% url 'myERP:fee' %}"><i class="bi bi-cash-stack"></i> Fee Details</a>
            <a href="{% url 'myERP:subjects' %}"><i class="bi bi-book"></i> Subjects</a>
            <a href="{% url 'myERP:notices' %}"><i class="bi bi-bell"></i> Notices</a>
            <a href="{% url 'myERP:profile' %}"><i class="bi bi-person-circle"></i> Profile</a>
            <a href="{% url 'accounts:signout' %}"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">{% block title %}College ERP Dashboard{% endblock %}</span>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'myERP:profile' %}">
                                    <i class="bi bi-person-circle"></i> Welcome, {{ user.get_full_name|default:user.username }}
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'accounts:signout' %}">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
            {% with total=160000 paid=140000 due=20000 %}
            {% block content %}
            {% endblock %}
            {% endwith %}
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AOS Animation JS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    AOS.init({
        duration: 800,
        once: true
    });
</script>
</body>
</html>
